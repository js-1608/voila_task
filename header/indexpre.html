<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>   
    <style>

        .premium-model-box {
            display: none;
            position: absolute;
            top: 43px;
            background-color: white;
            color: black;
            padding: 10px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .premium-sub-box {
            display: none;
            margin-top: 10px;
            padding: 10px;
            width: 60px;
            height: 30px;
            border:1px solid black
        }

        .premium-subbutton {
            position: absolute;
            top: 43px;
            border-radius: 5px;
            left: 154px;
            background-color: #ffffff;
        }

        /* Show and hide states */
        .premium-show {
            display: block;
        }

        .premium-opacity_0 {
            opacity: 0;
        }

        .premium-opacity_1 {
            opacity: 1;
        }

        .premium-color_change {
            -webkit-text-stroke-width: 0.5px;
        }

        /* Hover effect for underlining */
        .premium-nav_hover_line {
            position: relative;
        }

        .premium-nav_hover_line::after {
            content: "";
            height: 2px;
            width: 0%;
            position: absolute;
            bottom: -3px;
            right: 0;
            border-radius: 5px;
            background-color: black;
            transition: all 0.3s linear;
        }

        .premium-nav_hover_line:hover::after {
            width: 100%;
            left: 0;
        }

        /* Smooth transition for boxes */
        .premium-model-box, .premium-sub-box {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Default and hover state for buttons */
        .premium-model-box p {
            color: black;
            transition: color 0.3s ease;
        }

        /* Active button state */
        .premium-model-box p.active {
            -webkit-text-stroke-width: 0.5px;
        }
    </style>
</head>
<body>
    <div>
        <div class="premium-submenu-container">
            <a href="#" id="model-shoot"><span id="premium-colorchange" class="premium-nav_hover_line">Select Backdrop </span>
            </a>
            <div class="premium-model-box" id="premium-model-box">
              <div class="">
                <div class="">
                  <p style="cursor: pointer" id="button1">SOLID COLOR BACKDROPS</p>
                  <p style="margin: 10px 0px; cursor: pointer" id="button2">PAPER BACKDROPS</p>
                  <p style="cursor: pointer" id="button3">PRINTED BACKDROPS</p>
                </div>
              </div>
            </div>
            <div class="premium-subbutton" style="overflow-y: scroll;">
              <div class="premium-sub-box" id="premium-sub-box1"></div>
              <div class="premium-sub-box" id="premium-sub-box2"></div>
              <div class="premium-sub-box" id="premium-sub-box3"></div>
            </div>
        </div>
    </div>

</body>
<script>document.addEventListener("DOMContentLoaded", () => {
  const modelShoot = document.getElementById("model-shoot");
  const colorchange = document.getElementById("premium-colorchange");
  const modelBox = document.getElementById("premium-model-box");
  const subBox1 = document.getElementById("premium-sub-box1");
  const subBox2 = document.getElementById("premium-sub-box2");
  const subBox3 = document.getElementById("premium-sub-box3");
  const buttons = [
    document.getElementById("button1"),
    document.getElementById("button2"),
    document.getElementById("button3"),
  ];

  let isModelBoxHovered = false;

  // Show the model-box when hovering over the "Select Backdrop" link
  modelShoot.addEventListener("mouseenter", () => {
    modelBox.classList.add("premium-show");
    colorchange.classList.add("premium-color_change");
  });

  // Track hover state over the model-box and sub-boxes
  modelBox.addEventListener("mouseenter", () => {
    isModelBoxHovered = true;
  });
  modelBox.addEventListener("mouseleave", () => {
    isModelBoxHovered = false;
    hideModelBox();
  });

  // Hide model-box when mouse leaves the entire area
  modelShoot.addEventListener("mouseleave", () => {
    setTimeout(() => {
      if (!isModelBoxHovered) {
        modelBox.classList.remove("premium-show");
        colorchange.classList.remove("premium-color_change");
      }
    }, 200); // Delay for smoother transition
  });

  // Show sub-box when hovering over buttons and highlight the active button
  buttons.forEach((button, index) => {
    button.addEventListener("mouseenter", () => {
      [subBox1, subBox2, subBox3].forEach((box) => box.classList.remove("premium-show"));
      const subBoxes = [subBox1, subBox2, subBox3];
      subBoxes[index].classList.add("premium-show");
      buttons.forEach((btn) => btn.classList.remove("active"));
      button.classList.add("active");
    });
  });

  // Hide the model-box if mouse leaves both the model and the sub-box areas
  function hideModelBox() {
    setTimeout(() => {
      if (!isModelBoxHovered) {
        modelBox.classList.remove("premium-show");
        colorchange.classList.remove("premium-color_change");
        [subBox1, subBox2, subBox3].forEach((box) => box.classList.remove("premium-show"));
        buttons.forEach((btn) => btn.classList.remove("active"));
      }
    }, 200);
  }

  // Hide the model-box and sub-boxes when clicking outside of them
  document.addEventListener("click", (e) => {
    if (!modelBox.contains(e.target) && !modelShoot.contains(e.target)) {
      modelBox.classList.remove("premium-show");
      colorchange.classList.remove("premium-color_change");
      [subBox1, subBox2, subBox3].forEach((box) => box.classList.remove("premium-show"));
      buttons.forEach((btn) => btn.classList.remove("active"));
    }
  });
});
</script>
</body>
</html>
